<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb25a"/>
      <stop offset="0.55" stop-color="#f27a5e"/>
      <stop offset="1" stop-color="#c94a6a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.6" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jet" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8ff5d2" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="house">
      <path d="M268 488 L268 800 L756 800 L756 488 Z"/>
    </clipPath>
    <clipPath id="roof">
      <path d="M214 506 L512 258 L810 506 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="330" r="300" fill="url(#sun)"/>
  <!-- hills -->
  <path d="M0 760 Q 200 700 380 742 T 760 730 T 1024 744 L1024 1024 L0 1024 Z" fill="#7a3f55" opacity="0.55"/>
  <path d="M0 812 Q 260 770 512 800 T 1024 796 L1024 1024 L0 1024 Z" fill="#2e5a34"/>

  <g transform="translate(512 560) scale(1.16) translate(-512 -560)">
  <!-- clean half -->
  <g clip-path="url(#right)">
    <rect x="268" y="488" width="488" height="312" fill="#fff6e6"/>
    <path d="M214 506 L512 258 L810 506 Z" fill="#e2553a"/>
  </g>
  <!-- dirty half: mud, moss, streaks -->
  <g clip-path="url(#left)">
    <rect x="268" y="488" width="488" height="312" fill="#8a7650"/>
    <g clip-path="url(#house)">
      <ellipse cx="330" cy="560" rx="90" ry="60" fill="#5d6a34"/>
      <ellipse cx="450" cy="700" rx="110" ry="70" fill="#5b4a30"/>
      <ellipse cx="300" cy="760" rx="80" ry="50" fill="#4a5a2c"/>
      <rect x="320" y="488" width="14" height="190" fill="#4a3c26" opacity="0.6"/>
      <rect x="420" y="488" width="10" height="140" fill="#4a3c26" opacity="0.6"/>
    </g>
    <path d="M214 506 L512 258 L810 506 Z" fill="#6e5236"/>
    <g clip-path="url(#roof)">
      <ellipse cx="380" cy="420" rx="90" ry="50" fill="#566a2e"/>
      <ellipse cx="300" cy="490" rx="70" ry="30" fill="#4a5c28"/>
    </g>
  </g>
  <!-- door and window -->
  <rect x="352" y="610" width="96" height="190" rx="8" fill="#2d4e5e"/>
  <rect x="566" y="570" width="128" height="104" rx="8" fill="#3a7d9c"/>
  <rect x="626" y="570" width="8" height="104" fill="#fff6e6"/>
  <rect x="566" y="618" width="128" height="8" fill="#fff6e6"/>
  <!-- the line where the jet has passed -->
  <rect x="503" y="262" width="18" height="538" fill="#ffffff" opacity="0.9"/>

  </g>
  <!-- pressure-washer jet from the corner -->
  <path d="M1010 1010 L512 260 L512 830 Z" fill="url(#jet)" opacity="0.3"/>
  <path d="M1010 1010 L512 260" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <g fill="#ffffff">
    <circle cx="560" cy="340" r="12"/><circle cx="600" cy="420" r="9"/><circle cx="548" cy="470" r="14"/>
    <circle cx="590" cy="560" r="10"/><circle cx="552" cy="640" r="12"/><circle cx="640" cy="730" r="9"/>
    <circle cx="700" cy="820" r="12"/><circle cx="780" cy="880" r="8"/>
  </g>
  <!-- sparkles on the clean side -->
  <g fill="#ffffff">
    <path d="M760 396 L774 436 L814 450 L774 464 L760 504 L746 464 L706 450 L746 436 Z"/>
    <path d="M880 250 L888 274 L912 282 L888 290 L880 314 L872 290 L848 282 L872 274 Z"/>
    <path d="M680 720 L688 742 L710 750 L688 758 L680 780 L672 758 L650 750 L672 742 Z"/>
  </g>
</svg>
