<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Клін Клінич — trailer compositor</title>
<style>
  /* Rubik (SIL OFL 1.1) — the game's own typeface */
  @font-face { font-family: Rubik; font-weight: 500; src: url(fonts/rubik-cyrillic-500-normal.woff2) format("woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: Rubik; font-weight: 500; src: url(fonts/rubik-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-024F, U+2000-206F; }
  @font-face { font-family: Rubik; font-weight: 700; src: url(fonts/rubik-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: Rubik; font-weight: 700; src: url(fonts/rubik-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-024F, U+2000-206F; }
  @font-face { font-family: Rubik; font-weight: 900; src: url(fonts/rubik-cyrillic-900-normal.woff2) format("woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: Rubik; font-weight: 900; src: url(fonts/rubik-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-024F, U+2000-206F; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Draws output frame f (0…539) of the trailer from the captured clips:
// grade, push-ins, shake on the hits, whip blurs on the cuts, the dirty→clean
// wipe, and the kinetic Ukrainian typography. Driven by compose.mjs.
const W = 1080, H = 1920, FPS = 30, BEAT = 60 / 140 * FPS; // frames per beat
const c = document.getElementById("c"), g = c.getContext("2d");
const cache = new Map();
let EDIT = null;

function img(src) {
  if (cache.has(src)) return cache.get(src);
  const p = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; });
  cache.set(src, p);
  if (cache.size > 40) cache.delete(cache.keys().next().value);
  return p;
}
const clip = (shot, i) => `clips/${shot}/${String(i + 1).padStart(4, "0")}.jpg`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const outBack = (t) => { t = clamp(t); const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const outExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t)));

/** Cover-fit an image with zoom z around the centre plus an offset. */
function drawCover(im, z = 1, dx = 0, dy = 0, rot = 0) {
  const s = Math.max(W / im.width, H / im.height) * z;
  g.save();
  g.translate(W / 2 + dx, H / 2 + dy);
  g.rotate(rot);
  g.drawImage(im, -im.width * s / 2, -im.height * s / 2, im.width * s, im.height * s);
  g.restore();
}

/** Big punchy text with a dark outline and a soft drop shadow. */
function title(text, x, y, size, { color = "#fff", stroke = "#14100c", weight = 900, scale = 1, rot = 0, alpha = 1, align = "center", tracking = 0 } = {}) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y);
  g.rotate(rot);
  g.scale(scale, scale);
  g.font = `${weight} ${size}px Rubik`;
  g.textAlign = align;
  g.textBaseline = "middle";
  if (tracking) g.letterSpacing = `${tracking}px`;
  g.shadowColor = "rgba(0,0,0,0.45)";
  g.shadowBlur = size * 0.25;
  g.shadowOffsetY = size * 0.08;
  g.lineJoin = "round";
  g.lineWidth = size * 0.16;
  g.strokeStyle = stroke;
  g.strokeText(text, 0, 0);
  g.shadowColor = "transparent";
  g.fillStyle = color;
  g.fillText(text, 0, 0);
  g.restore();
}

/** A rounded label: game-HUD style pill. */
function pill(text, x, y, size, bg, fg, alpha = 1, scale = 1) {
  if (alpha <= 0) return;
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y);
  g.scale(scale, scale);
  g.font = `900 ${size}px Rubik`;
  const w = g.measureText(text).width + size * 1.4, h = size * 1.75;
  g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 24; g.shadowOffsetY = 8;
  g.fillStyle = bg;
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fill();
  g.shadowColor = "transparent";
  g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 0, size * 0.04);
  g.restore();
}

function vignette(k = 0.55) {
  const r = g.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.48, H * 0.75);
  r.addColorStop(0, "rgba(0,0,0,0)");
  r.addColorStop(1, `rgba(20,8,4,${k})`);
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}

/** Shake that kicks on a hit and decays. */
function shake(f, hits) {
  let x = 0, y = 0, r = 0;
  for (const [at, amp] of hits) {
    const d = f - at;
    if (d < 0 || d > 14) continue;
    const k = amp * Math.exp(-d / 4);
    x += Math.sin(d * 2.7 + at) * 22 * k; y += Math.cos(d * 3.3 + at) * 18 * k; r += Math.sin(d * 2.1) * 0.012 * k;
  }
  return [x, y, r];
}

const LABELS = {
  c1_mow: "КОСИ", c2_roof: "ЛАТАЙ ДАХ", c3_pool: "ЧИСТЬ БАСЕЙН", c4_dishes: "МИЙ ПОСУД",
  b3_timelapse: "ДО БЛИСКУ",
};

async function frame(f) {
  const cut = EDIT.cuts.filter((q) => q.at <= f).pop();
  const local = f - cut.at;
  const src = cut.from + local;
  const im = await img(clip(cut.shot, src));
  const hits = [[0, 1.2], [90, 1.4], [206, 0.7], [334, 0.8], [450, 0.6], [514, 1.6]];
  const [sx, sy, sr] = shake(f, hits);
  // grade: richer colour, a touch more contrast
  g.filter = "saturate(1.12) contrast(1.06) brightness(1.02)";
  // push-in over each shot; a stronger one on the hook
  const k = local / cut.len;
  let z = 1.0 + 0.05 * k;
  if (cut.shot === "a1_grass") z = 1.12 - 0.08 * ease(k);
  // whip blur into and out of a cut
  const near = Math.min(local, cut.len - 1 - local);
  if (near <= 1 && f > 2 && f < 448) {
    g.filter += ` blur(${near === 0 ? 7 : 3}px)`;
    drawCover(im, z * 1.04, sx + (local <= 1 ? -40 : 40) * (2 - near) / 2, sy, sr);
  } else if (cut.shot === "e1_clean") {
    // the reveal: the same camera move on the dirty house wipes to the clean one
    drawCover(im, z, sx, sy, sr);
    if (local < 45) {
      const dirty = await img(clip("a1_grass", local));
      const p = ease((local - 6) / 30); // wipe position 0…1
      const xw = W * (1 - p);
      if (p < 1) {
        g.save(); g.beginPath(); g.rect(0, 0, xw, H); g.clip();
        drawCover(dirty, 1.12 - 0.08 * ease(local / 45), sx, sy, sr);
        g.restore();
        if (p > 0) {
          // a bright glint along the wipe edge
          g.filter = "none";
          const gr = g.createLinearGradient(xw - 70, 0, xw + 70, 0);
          gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.5, "rgba(255,250,230,0.9)"); gr.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = gr; g.fillRect(xw - 70, 0, 140, H);
        }
      }
    }
  } else {
    drawCover(im, z, sx, sy, sr);
  }
  g.filter = "none";
  vignette(cut.shot.startsWith("e1") ? 0.45 : 0.5);

  // flash on the drop and on the final hit
  for (const [at, a] of [[90, 0.85], [514, 0.7]]) {
    const d = f - at;
    if (d >= 0 && d < 6) { g.fillStyle = `rgba(255,248,235,${a * (1 - d / 6)})`; g.fillRect(0, 0, W, H); }
  }

  // ── typography ───────────────────────────────────────────────────────
  // hook
  if (f >= 6 && f < 90) {
    const t1 = (f - 6) / 8, t2 = (f - 22) / 8;
    const out = f > 84 ? 1 - (f - 84) / 6 : 1;
    title("ХТО ЦЕ БУДЕ", W / 2, H * 0.2, 104, { scale: outBack(t1) * 1, rot: -0.05, alpha: clamp(t1 * 3) * out });
    title("ПРИБИРАТИ?!", W / 2, H * 0.2 + 128, 132, { color: "#ffc93c", scale: outBack(t2), rot: -0.05, alpha: clamp(t2 * 3) * out });
  }
  // short tool captions on the montage
  if (LABELS[cut.shot] && local >= 2) {
    const t = (local - 2) / 6, out = local > cut.len - 4 ? (cut.len - local) / 4 : 1;
    pill(LABELS[cut.shot], W / 2, H * 0.17, 58, "#3fd69f", "#062419", clamp(t * 2) * out, outBack(t));
  }
  // progression: three words on the beat
  const words = [["МИЙ.", 334, "#ffffff"], ["РЕМОНТУЙ.", 334 + Math.round(BEAT * 2), "#3fd69f"], ["ЗАРОБЛЯЙ.", 334 + Math.round(BEAT * 4), "#ffc93c"]];
  if (f >= 334 && f < 450) {
    words.forEach(([w, at, col], i) => {
      if (f < at) return;
      const t = (f - at) / 7, out = f > 444 ? 1 - (f - 444) / 6 : 1;
      title(w, W / 2, H * 0.105 + i * 108, 100, { color: col, scale: outBack(t), rot: -0.04, alpha: clamp(t * 3) * out });
    });
  }
  // finale: darken a little, then the title, the line and the call to action
  if (f >= 482) {
    const d = ease((f - 482) / 14);
    g.fillStyle = `rgba(12,6,4,${0.45 * d})`; g.fillRect(0, 0, W, H);
    const t1 = (f - 486) / 9;
    title("КЛІН", W / 2, H * 0.36, 210, { scale: outBack(t1), alpha: clamp(t1 * 3), tracking: 4 });
    title("КЛІНИЧ", W / 2, H * 0.36 + 200, 210, { color: "#3fd69f", scale: outBack((f - 490) / 9), alpha: clamp((f - 490) / 3), tracking: 4 });
    const t2 = (f - 500) / 8;
    title("ЧАС НАВЕСТИ ЛАД!", W / 2, H * 0.36 + 350, 74, { color: "#ffc93c", weight: 900, scale: outBack(t2), alpha: clamp(t2 * 3) });
    const t3 = (f - 514) / 7;
    const pulse = 1 + 0.035 * Math.sin((f - 514) / BEAT * Math.PI * 2) * clamp((f - 520) / 6);
    pill("ГРАЙ ЗАРАЗ", W / 2, H * 0.75, 76, "#3fd69f", "#062419", clamp(t3 * 3), outBack(t3) * pulse);
    const t4 = (f - 518) / 8;
    if (t4 > 0) {
      g.save(); g.globalAlpha = clamp(t4); g.font = "700 34px Rubik"; g.textAlign = "center"; g.fillStyle = "rgba(255,255,255,0.88)";
      g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 10;
      g.fillText("vladkononenko17.github.io/mobile-roguelite/hata", W / 2, H * 0.75 + 130);
      g.fillText("для iPhone · у браузері", W / 2, H * 0.75 + 178);
      g.restore();
    }
  }
}

window.setEdit = (e) => { EDIT = e; };
window.renderFrame = async (f) => { await document.fonts.ready; await frame(f); return c.toDataURL("image/jpeg", 0.95); };
window.ready = Promise.all(["900 40px Rubik", "700 40px Rubik"].map((x) => document.fonts.load(x, "КЛІНabc")));
</script>
</body>
</html>
